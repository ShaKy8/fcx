[package]
name = "fc-core"
description = "Filesystem, job, rename, and search logic for fc (no GUI dependencies)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
compress-tools = "0.16.1"
flate2 = "1.1.10"
md-5 = "0.11.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
similar = "3.2.0"
tar = "0.4.46"
thiserror.workspace = true
toml = "1.1.6"
zip = { version = "7.2.0", default-features = false, features = ["deflate-flate2-zlib-rs", "time"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
