# Default fc keybindings, following FreeCommander XE's defaults
# (https://freecommander.com/fchelpxe/en/Keyboardshortcuts.html). Copy to
# ~/.config/fc/keymap.toml and change what you like; your file is layered over
# these defaults. Bind a chord to "none" to remove it.
#
# Chords are modifier names joined with "+", then a key name: Ctrl, Shift, Alt, Super.
# Key names follow GDK (F5, Return, BackSpace, Page_Up, Insert, space, plus, minus,
# asterisk, a..z). Names are case-insensitive; keypad keys map onto their plain
# names (KP_Add = plus). Shift is implied for shifted symbols, so write
# "asterisk", not "Shift+8".
#
# Where FreeCommander has no default, fc adds one and says so.

[bindings]
# --- file operations (the F-key row) ---
F2 = "rename"                  # with several items marked, opens the multi rename tool
"Ctrl+m" = "multi-rename"
F3 = "view"
"Shift+F3" = "view"
"Ctrl+q" = "quick-view"
F4 = "edit"
"Shift+F4" = "new-file"
F5 = "copy"
F6 = "move"
F7 = "new-folder"
F8 = "delete"                  # functions-bar convention; FC's list has Del only
Delete = "delete"
"Shift+Delete" = "delete-permanent"
"Alt+Return" = "properties"
"Shift+Return" = "change-attributes"
"Shift+F10" = "context-menu"
Menu = "context-menu"

# --- clipboard ---
"Ctrl+c" = "clipboard-copy"
"Ctrl+x" = "clipboard-cut"
"Ctrl+v" = "clipboard-paste"
"Alt+Insert" = "copy-full-paths"
"Shift+Alt+Insert" = "copy-names"
"Ctrl+Alt+Insert" = "copy-folder-path"

# --- selection ---
Insert = "mark-and-down"
space = "toggle-mark"
"Shift+Up" = "mark-up"
"Shift+Down" = "mark-down"
"Ctrl+a" = "mark-all"
plus = "mark-pattern"
minus = "unmark-pattern"
"Ctrl+minus" = "unmark-all"
"Alt+plus" = "mark-same-ext"
"Alt+minus" = "unmark-same-ext"
asterisk = "invert-marks"
"Ctrl+asterisk" = "invert-file-marks"

# --- folders & panes ---
Tab = "switch-pane"
"Shift+Tab" = "switch-pane"
BackSpace = "go-up"
"Ctrl+Home" = "go-root"
"Alt+Left" = "back"
"Alt+Right" = "forward"
"Alt+g" = "go-to-folder"
"Ctrl+l" = "go-to-folder"      # fc extra: the usual GTK/Nautilus key
"Ctrl+r" = "reload"
"Shift+Ctrl+r" = "reload-all"
"Ctrl+e" = "same-folder-both"
"Ctrl+u" = "swap-panes"
"Ctrl+d" = "open-terminal"
"Ctrl+f" = "search"
"Ctrl+Page_Down" = "open-archive"
"Alt+F5" = "pack"
"Alt+F6" = "extract"
"Alt+F7" = "search"
"Ctrl+y" = "quick-filter"
"Alt+v" = "compare-folders"
"Alt+s" = "sync-folders"
"Ctrl+F9" = "calc-size"
"Alt+F9" = "calc-size-all"

# --- tabs ---
"Ctrl+t" = "new-tab"
"Ctrl+w" = "close-tab"
"Shift+Ctrl+w" = "close-other-tabs"
"Shift+Ctrl+t" = "restore-tab"
"Ctrl+Page_Up" = "last-active-tab"
"Ctrl+Tab" = "next-tab"          # fc extra
"Shift+Ctrl+Tab" = "prev-tab"    # fc extra

# --- favorites (Shift+Ctrl+1..0 jump to the first ten; see the Favorites menu) ---
"Shift+Ctrl+v" = "add-favorite"
"Shift+Ctrl+f" = "edit-favorites"
"Alt+Up" = "favorites-menu"

# --- sorting ---
"Ctrl+F3" = "sort-by-name"
"Ctrl+F4" = "sort-by-ext"      # FC: "by type"; fc has no type column, so by extension
"Shift+Ctrl+F4" = "sort-by-ext"
"Ctrl+F5" = "sort-by-date"
"Ctrl+F6" = "sort-by-size"

# --- view ---
"Alt+h" = "toggle-hidden"      # fc extra: FC has no default key for hidden files
"Ctrl+h" = "toggle-split-orientation"
"Alt+t" = "toggle-tree"
"Ctrl+F1" = "view-list"
"Ctrl+F2" = "view-details"
"Ctrl+i" = "view-thumbnails"
F9 = "view-cycle"
F10 = "toggle-single-pane"
F11 = "toggle-fullscreen"

# --- app ---
F1 = "show-shortcuts"
"Alt+F4" = "quit"
