# Default fc keybindings, following FreeCommander XE. Copy to
# ~/.config/fc/keymap.toml and change what you like; your file is layered over
# these defaults. Bind a chord to "none" to remove it.
#
# Chords are modifier names joined with "+", then a key name: Ctrl, Shift, Alt, Super.
# Key names follow GDK (F5, Return, BackSpace, Page_Up, Insert, space, plus, minus,
# asterisk, backslash, a..z). Names are case-insensitive. Shift is implied for
# shifted symbols, so write "asterisk", not "Shift+8".

[bindings]
# --- file operations (the F-key row) ---
F2 = "rename"
F3 = "view"
F4 = "edit"
"Shift+F4" = "new-file"
F5 = "copy"
F6 = "move"
F7 = "new-folder"
F8 = "delete"
Delete = "delete"
"Shift+F8" = "delete-permanent"
"Shift+Delete" = "delete-permanent"

# --- clipboard ---
"Ctrl+c" = "clipboard-copy"
"Ctrl+x" = "clipboard-cut"
"Ctrl+v" = "clipboard-paste"

# --- panes & navigation ---
Tab = "switch-pane"
"Shift+Tab" = "switch-pane"
BackSpace = "go-up"
"Alt+Up" = "go-up"
"Ctrl+BackSpace" = "go-root"
"Ctrl+backslash" = "go-root"
"Alt+Left" = "back"
"Alt+Right" = "forward"
"Ctrl+l" = "focus-path"
"Ctrl+r" = "reload"
"Ctrl+h" = "toggle-hidden"
"Ctrl+Left" = "open-in-left"
"Ctrl+Right" = "open-in-right"
"Ctrl+u" = "swap-panes"

# --- marks ---
Insert = "mark-and-down"
space = "toggle-mark"
"Shift+Up" = "mark-up"
"Shift+Down" = "mark-down"
"Ctrl+a" = "mark-all"
plus = "mark-all"
minus = "unmark-all"
asterisk = "invert-marks"

# --- sorting ---
"Ctrl+F3" = "sort-by-name"
"Ctrl+F4" = "sort-by-ext"
"Ctrl+F5" = "sort-by-date"
"Ctrl+F6" = "sort-by-size"

# --- app ---
"Alt+F4" = "quit"
